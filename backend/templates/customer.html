<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cd.css') }}">
    <script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/cd.js') }}" defer></script>
    <title>Welcome! Customer</title>
</head>
<body>
    <header>
        <h2>Welcome! <span id="customer-last-name">Customer</span>!!!</h2>
        <p>Drone Delivery Management System</p>
        <button id="logout-btn">Logout</button>
    </header>
    <main>
        <section class="profile-section">
            <h3>Profile Settings</h3>
            <p class="section-description">Manage your Personal Details</p>
            <form id="profile-form">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first_name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last_name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" disabled>
                </div>
                <div class="form-group">
                    <label for="phone">Phone No.</label>
                    <input type="tel" id="phone" name="phone_no" maxlength="10" required>
                </div>
                <button type="submit" id="save-profile-btn">Save Changes</button>
            </form>
        </section>
        <section class="warning">
            <h3>Warning!</h3>
            <p>Deleting your account is permanent and cannot be undone</p>
            <button id="delete-account-btn">Delete Account</button>
        </section>
    </main>
</body>
</html>
